openapi: 3.1.0
info:
  title: IyziTrace Platform Gateway API
  version: 1.0.0
  summary: OpenAPI description of the public gateway endpoints exposed by the IyziTrace platform.
  description: |
    This specification documents the public HTTP surface exposed by the platform NGINX gateway.

    Included:
    - Platform core system status
    - OpAMP/Lawrence management APIs
    - Inventory APIs
    - OTLP and OpAMP ingestion routes
    - Curated query passthrough routes for metrics, logs, and traces

    Excluded:
    - `/api/v1/platform/auth/*` endpoints are intentionally omitted from this Swagger document.

    Notes:
    - Several endpoints are gateway passthroughs to upstream systems such as Thanos, Loki, Tempo, OTLP receivers, and Lawrence.
    - Authentication enforcement is configurable at runtime. The security schemes documented here describe the expected access pattern, but some routes may be open if the corresponding platform security toggle is disabled.
servers:
  - url: http://localhost
    description: Local HTTP gateway
  - url: https://localhost
    description: Local HTTPS gateway
tags:
  - name: System
    description: Platform health and status endpoints.
  - name: Ingestion
    description: Gateway endpoints for OTLP and OpAMP ingestion.
  - name: Metrics Query
    description: Curated Thanos/Prometheus query passthrough endpoints.
  - name: Logs Query
    description: Curated Loki query passthrough endpoints.
  - name: Traces Query
    description: Curated Tempo query passthrough endpoints.
  - name: OpAMP Agents
    description: Lawrence agent management operations exposed through the platform gateway.
  - name: OpAMP Groups
    description: Lawrence group management operations exposed through the platform gateway.
  - name: OpAMP Configs
    description: Lawrence config management operations exposed through the platform gateway.
  - name: OpAMP Telemetry
    description: Lawrence telemetry and Lawrence QL endpoints exposed through the platform gateway.
  - name: OpAMP Topology
    description: Lawrence topology endpoints exposed through the platform gateway.
  - name: Inventory
    description: Inventory and topology APIs served by inventory-service.
paths:
  /api/v1/platform/system/status:
    get:
      tags: [System]
      operationId: getPlatformSystemStatus
      summary: Get platform system status
      description: |
        Returns the platform-level component health view used by the console.
        This endpoint is implemented by `auth-service`, but the auth-management endpoints themselves are intentionally excluded from this specification.
      security:
        - bearerAuth: []
        - iyzitraceApiKey: []
      responses:
        "200":
          description: Platform health was collected successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatusResponse"
        "401":
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Request rejected by security policy, for example when HTTPS is enforced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to collect status from one or more components.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ingest/otlp/v1/traces:
    post:
      tags: [Ingestion]
      operationId: ingestOtlpTraces
      summary: Ingest OTLP traces over HTTP
      description: |
        Gateway route for OpenTelemetry trace ingestion. The request is forwarded to the trace collector and rewritten to `/v1/traces`.

        The collector accepts standard OTLP/HTTP payloads. This specification intentionally models the body as opaque gateway input instead of embedding the full OTLP protobuf schema.
      security:
        - iyzitraceApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtlpJsonEnvelope"
            examples:
              sample:
                value:
                  resourceSpans:
                    - resource:
                        attributes:
                          - key: service.name
                            value:
                              stringValue: checkout
                      scopeSpans:
                        - spans:
                            - traceId: 5b8efff798038103d269b633813fc60c
                              spanId: eee19b7ec3c1b174
                              name: process_payment
                              kind: 1
                              startTimeUnixNano: "1544712660000000000"
                              endTimeUnixNano: "1544712661000000000"
          application/x-protobuf:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Payload accepted by the upstream collector.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
        "400":
          description: Invalid OTLP payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Agent key required when ingress protection is enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ingest/otlp/v1/metrics:
    post:
      tags: [Ingestion]
      operationId: ingestOtlpMetrics
      summary: Ingest OTLP metrics over HTTP
      description: |
        Gateway route for OpenTelemetry metric ingestion. The request is forwarded to the metrics collector and rewritten to `/v1/metrics`.
      security:
        - iyzitraceApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtlpJsonEnvelope"
            examples:
              sample:
                value:
                  resourceMetrics:
                    - resource:
                        attributes:
                          - key: service.name
                            value:
                              stringValue: checkout
                      scopeMetrics:
                        - metrics:
                            - name: http.server.duration
                              unit: ms
          application/x-protobuf:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Payload accepted by the upstream collector.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
        "400":
          description: Invalid OTLP payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Agent key required when ingress protection is enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ingest/otlp/v1/logs:
    post:
      tags: [Ingestion]
      operationId: ingestOtlpLogs
      summary: Ingest OTLP logs over HTTP
      description: |
        Gateway route for OpenTelemetry log ingestion. The request is forwarded to the log collector and rewritten to `/v1/logs`.
      security:
        - iyzitraceApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtlpJsonEnvelope"
            examples:
              sample:
                value:
                  resourceLogs:
                    - resource:
                        attributes:
                          - key: service.name
                            value:
                              stringValue: checkout
                      scopeLogs:
                        - logRecords:
                            - timeUnixNano: "1544712661000000000"
                              severityText: ERROR
                              body:
                                stringValue: Payment provider timeout
          application/x-protobuf:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Payload accepted by the upstream collector.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
        "400":
          description: Invalid OTLP payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Agent key required when ingress protection is enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ingest/opamp/v1/ws:
    get:
      tags: [Ingestion]
      operationId: openOpampWebSocket
      summary: Open OpAMP management WebSocket
      description: |
        Opens the OpAMP management WebSocket used by agents. The gateway upgrades the request and rewrites the upstream path to `/v1/opamp`.

        OpenAPI cannot fully describe the bidirectional OpAMP session protocol, so this operation documents the HTTP upgrade entrypoint only.
      security:
        - iyzitraceApiKey: []
      responses:
        "101":
          description: WebSocket upgrade accepted.
        "401":
          description: Agent key required when ingress protection is enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ingest/opamp/v1/telemetry/{telemetryPath}:
    post:
      tags: [Ingestion]
      operationId: ingestOpampTelemetry
      summary: Forward OpAMP agent telemetry
      description: |
        Forwards OTLP-style telemetry sent by Lawrence-managed agents through the OpAMP telemetry mirror.

        The `{telemetryPath}` segment represents the upstream path tail after `/ingest/opamp/v1/telemetry/`. In practice this is commonly used for telemetry subpaths such as `v1/metrics`, `v1/logs`, or `v1/traces`.
      security:
        - iyzitraceApiKey: []
      parameters:
        - name: telemetryPath
          in: path
          required: true
          description: Upstream telemetry path tail after the mirror prefix.
          schema:
            type: string
          example: v1/metrics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtlpJsonEnvelope"
          application/x-protobuf:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Telemetry forwarded successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
        "400":
          description: Invalid telemetry payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Agent key required when ingress protection is enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /query/v1/metrics/api/v1/query:
    get:
      tags: [Metrics Query]
      operationId: queryMetricsInstant
      summary: Execute an instant PromQL query through the gateway
      description: |
        Curated Thanos/Prometheus passthrough route. The gateway strips the `/query/v1/metrics/` prefix and forwards the request to Thanos Query.
      security:
        - iyzitraceApiKey: []
      parameters:
        - $ref: "#/components/parameters/PromQuery"
        - $ref: "#/components/parameters/PromTime"
        - $ref: "#/components/parameters/PromTimeout"
        - $ref: "#/components/parameters/PromDedup"
      responses:
        "200":
          description: Successful upstream query response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrometheusQueryResponse"
        "401":
          description: External reader key required when query protection is enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /query/v1/metrics/api/v1/query_range:
    get:
      tags: [Metrics Query]
      operationId: queryMetricsRange
      summary: Execute a range PromQL query through the gateway
      description: Curated Thanos/Prometheus range query passthrough.
      security:
        - iyzitraceApiKey: []
      parameters:
        - $ref: "#/components/parameters/PromQuery"
        - $ref: "#/components/parameters/PromStart"
        - $ref: "#/components/parameters/PromEnd"
        - $ref: "#/components/parameters/PromStep"
        - $ref: "#/components/parameters/PromTimeout"
        - $ref: "#/components/parameters/PromDedup"
      responses:
        "200":
          description: Successful upstream query response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrometheusQueryResponse"
        "401":
          description: External reader key required when query protection is enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /query/v1/metrics/api/v1/series:
    get:
      tags: [Metrics Query]
      operationId: queryMetricsSeries
      summary: List matching series through the gateway
      description: Curated Thanos/Prometheus series passthrough.
      security:
        - iyzitraceApiKey: []
      parameters:
        - name: match[]
          in: query
          required: true
          description: One or more PromQL series selectors.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          example:
            - '{__name__="up"}'
        - $ref: "#/components/parameters/PromStart"
        - $ref: "#/components/parameters/PromEnd"
      responses:
        "200":
          description: Successful upstream series response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrometheusQueryResponse"

  /query/v1/metrics/api/v1/labels:
    get:
      tags: [Metrics Query]
      operationId: queryMetricLabels
      summary: List metric labels through the gateway
      description: Curated Thanos/Prometheus label passthrough.
      security:
        - iyzitraceApiKey: []
      parameters:
        - $ref: "#/components/parameters/PromStart"
        - $ref: "#/components/parameters/PromEnd"
      responses:
        "200":
          description: Successful upstream label response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrometheusQueryResponse"

  /query/v1/metrics/api/v1/label/{name}/values:
    get:
      tags: [Metrics Query]
      operationId: queryMetricLabelValues
      summary: List metric label values through the gateway
      description: Curated Thanos/Prometheus label-value passthrough.
      security:
        - iyzitraceApiKey: []
      parameters:
        - name: name
          in: path
          required: true
          description: Prometheus label name.
          schema:
            type: string
        - $ref: "#/components/parameters/PromStart"
        - $ref: "#/components/parameters/PromEnd"
      responses:
        "200":
          description: Successful upstream label values response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrometheusQueryResponse"

  /query/v1/logs/loki/api/v1/query:
    get:
      tags: [Logs Query]
      operationId: queryLogsInstant
      summary: Execute an instant LogQL query through the gateway
      description: |
        Curated Loki passthrough route. The gateway strips the `/query/v1/logs/` prefix and forwards the request to Loki.
      security:
        - iyzitraceApiKey: []
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
          example: '{service_name="checkout"}'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 100
        - name: time
          in: query
          schema:
            type: string
            description: RFC3339 or Unix nanoseconds supported by Loki.
      responses:
        "200":
          description: Successful upstream Loki response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LokiQueryResponse"

  /query/v1/logs/loki/api/v1/query_range:
    get:
      tags: [Logs Query]
      operationId: queryLogsRange
      summary: Execute a range LogQL query through the gateway
      description: Curated Loki range query passthrough.
      security:
        - iyzitraceApiKey: []
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
        - name: start
          in: query
          schema:
            type: string
            description: RFC3339 or Unix nanoseconds supported by Loki.
        - name: end
          in: query
          schema:
            type: string
            description: RFC3339 or Unix nanoseconds supported by Loki.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 100
        - name: direction
          in: query
          schema:
            type: string
            enum: [forward, backward]
            default: backward
        - name: step
          in: query
          schema:
            type: string
            description: Query resolution for metric-style LogQL.
      responses:
        "200":
          description: Successful upstream Loki response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LokiQueryResponse"

  /query/v1/logs/loki/api/v1/labels:
    get:
      tags: [Logs Query]
      operationId: queryLogLabels
      summary: List Loki labels through the gateway
      description: Curated Loki label passthrough.
      security:
        - iyzitraceApiKey: []
      parameters:
        - name: start
          in: query
          schema:
            type: string
        - name: end
          in: query
          schema:
            type: string
        - name: query
          in: query
          schema:
            type: string
            description: Optional stream selector.
      responses:
        "200":
          description: Successful upstream Loki response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LokiQueryResponse"

  /query/v1/logs/loki/api/v1/label/{name}/values:
    get:
      tags: [Logs Query]
      operationId: queryLogLabelValues
      summary: List Loki label values through the gateway
      description: Curated Loki label-value passthrough.
      security:
        - iyzitraceApiKey: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: start
          in: query
          schema:
            type: string
        - name: end
          in: query
          schema:
            type: string
        - name: query
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Successful upstream Loki response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LokiQueryResponse"

  /query/v1/traces/api/search:
    get:
      tags: [Traces Query]
      operationId: queryTraceSearch
      summary: Search traces through the gateway
      description: |
        Curated Tempo passthrough route. The gateway strips the `/query/v1/traces/` prefix and forwards the request to Tempo.
      security:
        - iyzitraceApiKey: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Tempo TraceQL query string.
        - name: tags
          in: query
          schema:
            type: string
          description: Jaeger-style tags filter for search endpoints.
        - name: service
          in: query
          schema:
            type: string
        - name: operation
          in: query
          schema:
            type: string
        - name: minDuration
          in: query
          schema:
            type: string
        - name: maxDuration
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 20
        - name: start
          in: query
          schema:
            type: string
        - name: end
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Successful upstream Tempo search response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TempoSearchResponse"

  /query/v1/traces/api/services:
    get:
      tags: [Traces Query]
      operationId: queryTraceServices
      summary: List trace services through the gateway
      description: Curated Tempo passthrough.
      security:
        - iyzitraceApiKey: []
      responses:
        "200":
          description: Successful upstream Tempo response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"

  /query/v1/traces/api/search/tags:
    get:
      tags: [Traces Query]
      operationId: queryTraceTags
      summary: List searchable trace tags through the gateway
      description: Curated Tempo passthrough.
      security:
        - iyzitraceApiKey: []
      responses:
        "200":
          description: Successful upstream Tempo response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"

  /query/v1/traces/api/search/tag/{tagName}/values:
    get:
      tags: [Traces Query]
      operationId: queryTraceTagValues
      summary: List values for a trace tag through the gateway
      description: Curated Tempo passthrough.
      security:
        - iyzitraceApiKey: []
      parameters:
        - name: tagName
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful upstream Tempo response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"

  /query/v1/traces/api/traces/{traceId}:
    get:
      tags: [Traces Query]
      operationId: queryTraceById
      summary: Fetch a full trace through the gateway
      description: Curated Tempo passthrough for trace retrieval by trace ID.
      security:
        - iyzitraceApiKey: []
      parameters:
        - name: traceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful upstream Tempo response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TempoTraceResponse"
        "404":
          description: Trace not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/platform/opamp/health:
    get:
      tags: [OpAMP Telemetry]
      operationId: getOpampHealth
      summary: Get Lawrence health status
      description: Gateway route to Lawrence `/api/v1/health`.
      security:
        - bearerAuth: []
        - iyzitraceApiKey: []
      responses:
        "200":
          description: Lawrence is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpampHealthResponse"
        "503":
          description: Lawrence is unhealthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpampHealthResponse"

  /api/v1/platform/opamp/agents:
    get:
      tags: [OpAMP Agents]
      operationId: listOpampAgents
      summary: List managed agents
      security:
        - bearerAuth: []
        - iyzitraceApiKey: []
      responses:
        "200":
          description: Agent list returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAgentsResponse"
        "500":
          description: Failed to fetch agents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/platform/opamp/agents/stats:
    get:
      tags: [OpAMP Agents]
      operationId: getOpampAgentStats
      summary: Get aggregate agent statistics
      security:
        - bearerAuth: []
        - iyzitraceApiKey: []
      responses:
        "200":
          description: Agent statistics returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAgentStatsResponse"

  /api/v1/platform/opamp/agents/{id}:
    get:
      tags: [OpAMP Agents]
      operationId: getOpampAgent
      summary: Get a managed agent by ID
      security:
        - bearerAuth: []
        - iyzitraceApiKey: []
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Agent returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "400":
          description: Invalid agent ID format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Agent not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [OpAMP Agents]
      operationId: deleteOpampAgent
      summary: Delete a managed agent
      security:
        - bearerAuth: []
        - iyzitraceApiKey: []
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "204":
          description: Agent deleted successfully.
        "400":
          description: Invalid agent ID format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Agent not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to delete agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/platform/opamp/agents/{id}/group:
    patch:
      tags: [OpAMP Agents]
      operationId: updateOpampAgentGroup
      summary: Update an agent's group assignment
      description: This operation is currently registered but not implemented.
      security:
        - bearerAuth: []
        - iyzitraceApiKey: []
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAgentGroupRequest"
      responses:
        "501":
          description: Not implemented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/platform/opamp/agents/{id}/config:
    post:
      tags: [OpAMP Agents]
      operationId: sendConfigToOpampAgent
      summary: Store and send config to a managed agent
      security:
        - bearerAuth: []
        - iyzitraceApiKey: []
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendConfigRequest"
      responses:
        "200":
          description: Configuration sent successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendConfigResponse"
        "202":
          description: Configuration stored but delivery to the agent failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendConfigResponse"
        "400":
          description: Invalid agent ID or invalid request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Agent not found.
          content:
