components:
  securitySchemes:
    iyzitraceApiKey:
      type: apiKey
      in: header
      name: iyzitrace-api-key
      description: API key header used for agent ingress and external query consumers.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT bearer token accepted by platform middleware.
  parameters:
    AgentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Agent UUID.
    GroupId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Group identifier.
    ConfigId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Config identifier.
    EntityId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Inventory entity identifier.
    EntityType:
      name: type
      in: query
      description: Filter by one or more entity types.
      schema:
        type: array
        items:
          $ref: "#/components/schemas/EntityType"
      style: form
      explode: true
    EntityStatus:
      name: status
      in: query
      description: Filter by one or more entity lifecycle statuses.
      schema:
        type: array
        items:
          $ref: "#/components/schemas/EntityStatus"
      style: form
      explode: true
    RelationType:
      name: type
      in: query
      description: Filter by one or more relation types.
      schema:
        type: array
        items:
          $ref: "#/components/schemas/RelationType"
      style: form
      explode: true
    NameFilter:
      name: name
      in: query
      description: Entity name substring or pattern filter.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        default: 100
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    PromQuery:
      name: query
      in: query
      required: true
      schema:
        type: string
      description: PromQL query string.
    PromTime:
      name: time
      in: query
      schema:
        type: string
      description: RFC3339 or Unix timestamp supported by the Prometheus API.
    PromStart:
      name: start
      in: query
      schema:
        type: string
      description: Range start time.
    PromEnd:
      name: end
      in: query
      schema:
        type: string
      description: Range end time.
    PromStep:
      name: step
      in: query
      schema:
        type: string
      description: Query resolution step.
    PromTimeout:
      name: timeout
      in: query
      schema:
        type: string
      description: Upstream query timeout.
    PromDedup:
      name: dedup
      in: query
      schema:
        type: boolean
      description: Thanos deduplication toggle.
  schemas:
    GenericObject:
      type: object
      additionalProperties: true
    OtlpJsonEnvelope:
      type: object
      additionalProperties: true
      description: Simplified placeholder for OTLP JSON payloads.
    ErrorResponse:
