receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 4
        max_concurrent_streams: 100
      http:
        endpoint: 0.0.0.0:4318
        max_request_body_size: 4194304

exporters:
  otlp_http:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 1000

  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    resource_to_telemetry_conversion:
      enabled: true
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    remote_write_queue:
      enabled: true
      num_consumers: 5
      queue_size: 10000

  otlp_grpc/inventory:
    endpoint: inventory-service:4317
    tls:
      insecure: true
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 500

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024
    send_batch_max_size: 2048

  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 25

  # Deduplication — groups identical log records by resource attributes
  groupbyattrs:
    keys:
      - service.name
      - service.namespace

  # Resource enrichment — stamps collector identity on all telemetry
  resource/add_collector:
    attributes:
      - key: collector.name
        value: log-otel-enrichment
        action: upsert
      - key: collector.pipeline
        value: logs
        action: upsert

  transform/log:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          # Promote dot-notation resource attributes to underscore variants
          # so Loki can index them as labels (otlp_config maps service_name → label)
          - set(resource.attributes["service_name"], resource.attributes["service.name"])
          - set(resource.attributes["service_namespace"], resource.attributes["service.namespace"])

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  zpages:
    endpoint: 0.0.0.0:55679

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888
  extensions: [health_check, zpages]
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/add_collector, groupbyattrs, transform/log, batch]
      exporters: [otlp_http, otlp_grpc/inventory]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite]
