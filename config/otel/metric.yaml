receivers:
  otlp/trace:
    protocols:
      grpc:
        endpoint: 0.0.0.0:14317
        max_recv_msg_size_mib: 4
        max_concurrent_streams: 100
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 4
        max_concurrent_streams: 100
        # Exposes incoming metadata (incl. X-Scope-OrgID) via request
        # context. Prometheus/Thanos have no native tenant header (unlike
        # Loki/Tempo) — this only stamps the resource attribute for now;
        # Phase 3 adds the label-enforcement layer that consumes it. See
        # docs/architecture/multitenancy-licensing.md §8.
        include_metadata: true
      http:
        endpoint: 0.0.0.0:4318
        max_request_body_size: 4194304
        include_metadata: true

exporters:
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    resource_to_telemetry_conversion:
      enabled: true
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    remote_write_queue:
      enabled: true
      num_consumers: 5
      queue_size: 10000

  otlp_grpc/inventory:
    endpoint: inventory-service:4317
    tls:
      insecure: true
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 500

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024
    send_batch_max_size: 2048

  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 25

  # Resource enrichment — stamps collector identity
  resource/add_collector:
    attributes:
      - key: collector.name
        value: metric-otel-enrichment
        action: upsert
      - key: collector.pipeline
        value: metrics
        action: upsert

  # Multitenancy — stamps X-Scope-OrgID from client metadata for metrics
  # sent directly by agents (via nginx). NOT used on the metrics/otlp
  # pipeline: those datapoints arrive from trace-otel-enrichment's
  # spanmetrics/servicegraph connectors over an internal collector-to-
  # collector hop with no nginx-forwarded metadata — they already carry
  # tenant.org_id as a resource attribute set upstream in trace.yaml.
  resource/tenant:
    attributes:
      - key: tenant.org_id
        action: upsert
        from_context: metadata.x-scope-orgid

  transform/promote_resource_attrs:
    error_mode: ignore
    metric_statements:
      - set(datapoint.attributes["service.instance.id"], resource.attributes["service.instance.id"]) where resource.attributes["service.instance.id"] != nil
      - set(datapoint.attributes["service.name"], resource.attributes["service.name"]) where resource.attributes["service.name"] != nil
      - set(datapoint.attributes["service.namespace"], resource.attributes["service.namespace"]) where resource.attributes["service.namespace"] != nil
      - set(datapoint.attributes["service.version"], resource.attributes["service.version"]) where resource.attributes["service.version"] != nil
      - set(datapoint.attributes["host.name"], resource.attributes["host.name"]) where resource.attributes["host.name"] != nil
      - set(datapoint.attributes["host.id"], resource.attributes["host.id"]) where resource.attributes["host.id"] != nil

  metricstransform:
    transforms:
      - include: ^traces_service_graph(.*)$
        match_type: regexp
        action: update
        new_name: iyzitrace_service_graph$$1
      - include: ^traces\.span\.metrics\.(.*)$
        match_type: regexp
        action: update
        new_name: iyzitrace.span.metrics.$$1

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  zpages:
    endpoint: 0.0.0.0:55679

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888
  extensions: [health_check, zpages]
  pipelines:
    metrics/otlp:
      receivers: [otlp/trace]
      processors: [memory_limiter, resource/add_collector, metricstransform, transform/promote_resource_attrs, batch]
      exporters: [prometheusremotewrite, otlp_grpc/inventory]
    metrics/prometheus:
      receivers: [otlp]
      processors: [memory_limiter, resource/tenant, resource/add_collector, batch]
      exporters: [prometheusremotewrite, otlp_grpc/inventory]
