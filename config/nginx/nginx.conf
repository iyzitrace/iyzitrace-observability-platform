worker_processes auto;
events { worker_connections 2048; }

http {
  client_max_body_size 100m;
  keepalive_timeout 75s;
  absolute_redirect off;

  # OTLP/HTTP upstreams
  upstream log_otel_http   { server log-otel-enrichment:4318; keepalive 64; }
  upstream metric_otel_http{ server metric-otel-enrichment:4318; keepalive 64; }
  upstream trace_otel_http { server trace-otel-enrichment:4318; keepalive 64; }

  # OPAMP upstreams
  upstream opamp_otel_http { server lawrence:4320; keepalive 64; }
  upstream opamp_api_http { server lawrence:8080; keepalive 64; }
  upstream auth_service_http { server auth-service:8080; keepalive 64; }
  upstream opamp_telemetry_http { server lawrence:4318; keepalive 64; }

  # Datasource upstreams
  upstream datasource_metrics { server thanos-query:9091; keepalive 64; }
  upstream datasource_traces  { server tempo:3200; keepalive 64; }
  upstream datasource_logs    { server loki:3100; keepalive 64; }
  # Alerting — gated behind the "alerting" license feature (see
  # docs/architecture/multitenancy-licensing.md §16). Alertmanager wasn't
  # previously reachable through the gateway at all.
  upstream datasource_alerts  { server alertmanager:9093; keepalive 64; }

  # Inventory service upstream
  upstream inventory_service_http { server inventory-service:8080; keepalive 64; }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # HTTP ingress (80)
  server {
    listen 0.0.0.0:80;

    proxy_read_timeout 90s;
    proxy_send_timeout 90s;

    # --- Authentication Location ---
    location = /auth/validate {
        internal;
        proxy_pass http://auth_service_http/auth/validate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-Context $auth_context;
        # Named capability this request needs (empty = none). See
        # docs/architecture/multitenancy-licensing.md §16 — auth-service
        # checks this against the license: "ingest" requires a genuinely
        # usable license and blocks outright with none installed (§16.0);
        # any other name (inventory/agent_management/external_query/
        # alerting) is open with no license and becomes an allow-list once
        # one exists (§16.1). Runs independently of the agent/external
        # API-key toggles below.
        proxy_set_header X-License-Capability $license_capability;
    }

    # --- 1. Ingestion Endpoints (/ingest) ---
    # Agent/External -> OTel Collectors. All three OTLP signals require a
    # genuinely usable (active/grace) license — "ingest" capability, §16.0.

    # OTLP Logs
    location /ingest/otlp/v1/logs {
        set $auth_context "agent";
        set $license_capability "ingest";
        auth_request /auth/validate;
        # auth-service resolves the presented API key to its subtenant's
        # X-Scope-OrgID and returns it as a response header; capture it here
        # and forward it to the collector so it can stamp tenant.org_id onto
        # every span/metric/log record (see docs/architecture/
        # multitenancy-licensing.md §7). Unscoped (platform) keys resolve to
        # an empty string — collectors treat that as "no tenant".
        auth_request_set $scope_orgid $upstream_http_x_scope_orgid;
        rewrite ^/ingest/otlp/v1/logs/?(.*)$ /v1/logs break;
        proxy_http_version 1.1;
        proxy_set_header X-Scope-OrgID $scope_orgid;
        proxy_pass http://log_otel_http;
    }

    # OTLP Metrics — same "ingest" gate as traces/logs above. Thanos also
    # has no native per-tenant isolation (§8), but that's a separate,
    # opt-in concern (§16.2/metrics-tenancy-proxy) from the base
    # license-required-to-ingest-at-all gate here.
    location /ingest/otlp/v1/metrics {
        set $auth_context "agent";
        set $license_capability "ingest";
        auth_request /auth/validate;
        auth_request_set $scope_orgid $upstream_http_x_scope_orgid;
        rewrite ^/ingest/otlp/v1/metrics/?(.*)$ /v1/metrics break;
        proxy_http_version 1.1;
        proxy_set_header X-Scope-OrgID $scope_orgid;
        proxy_pass http://metric_otel_http;
    }

    # OTLP Traces
    location /ingest/otlp/v1/traces {
        set $auth_context "agent";
        set $license_capability "ingest";
        auth_request /auth/validate;
        auth_request_set $scope_orgid $upstream_http_x_scope_orgid;
        rewrite ^/ingest/otlp/v1/traces/?(.*)$ /v1/traces break;
        proxy_http_version 1.1;
        proxy_set_header X-Scope-OrgID $scope_orgid;
        proxy_pass http://trace_otel_http;
    }

    # OpAMP (Websocket) — agents must always be able to connect and report
    # status regardless of licensing; only Lawrence's *mutating* REST API
    # below is gated behind "agent_management".
    location /ingest/opamp/v1/ws {
        set $auth_context "agent";
        set $license_capability "";
        auth_request /auth/validate;
        rewrite ^/ingest/opamp/v1/ws(.*)$ /v1/opamp$1 break;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s; # Long-lived WS

        proxy_pass http://opamp_otel_http;
    }

    # OpAMP Telemetry
    location /ingest/opamp/v1/telemetry/ {
        set $auth_context "agent";
        set $license_capability "";
        auth_request /auth/validate;
        rewrite ^/ingest/opamp/v1/telemetry/(.*) /$1 break;
        proxy_http_version 1.1;
        proxy_pass http://opamp_telemetry_http;
    }

    # --- 2. Query Endpoints (/query) ---
    # External -> Backends (Thanos, Tempo, Loki) — all gated behind
    # "external_query" (some editions ingest-only, viewing only via Console).

    # Metrics (Prometheus/Thanos)
    # Maps /query/v1/metrics/api/v1/query -> /api/v1/query (Thanos)
    location /query/v1/metrics/ {
        set $auth_context "external";
        set $license_capability "external_query";
        auth_request /auth/validate;
        auth_request_set $scope_orgid $upstream_http_x_scope_orgid;
        rewrite ^/query/v1/metrics/(.*) /$1 break;
        proxy_http_version 1.1;
        proxy_set_header X-Scope-OrgID $scope_orgid;
        proxy_pass http://datasource_metrics;
    }

    # Alerting (Alertmanager) — gated behind "alerting".
    # Maps /query/v1/alerts/api/v2/alerts -> /api/v2/alerts
    location /query/v1/alerts/ {
        set $auth_context "external";
        set $license_capability "alerting";
        auth_request /auth/validate;
        rewrite ^/query/v1/alerts/(.*) /$1 break;
        proxy_http_version 1.1;
        proxy_pass http://datasource_alerts;
    }

    # --- Inventory Service API --- gated behind "inventory" (premium
    # topology/entity-detection module — see §16). Previously had no
    # auth_request at all; this is a deliberate, disclosed change.
    location /inventory/ {
      # CORS Headers for Grafana plugin
      add_header 'Access-Control-Allow-Origin' '*' always;
      add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
      add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,iyzitrace-api-key' always;
      add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

      # Handle preflight requests
      if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Type' 'text/plain; charset=utf-8';
        add_header 'Content-Length' 0;
        return 204;
      }

      set $auth_context "external";
      set $license_capability "inventory";
      auth_request /auth/validate;

      rewrite ^/inventory/(.*) /$1 break;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;

      proxy_read_timeout 90s;
      proxy_send_timeout 90s;

      proxy_pass http://inventory_service_http;
    }

    # Logs (Loki)
    # Maps /query/v1/logs/loki/api/v1/... -> /loki/api/v1/...
    location /query/v1/logs/ {
        set $auth_context "external";
        set $license_capability "external_query";
        auth_request /auth/validate;
        auth_request_set $scope_orgid $upstream_http_x_scope_orgid;
        rewrite ^/query/v1/logs/(.*) /$1 break; # Passthrough path (assuming client sends /loki/...)
        # OR if we want to shorten: rewrite ^/query/v1/logs/(.*) /loki/api/v1/$1 break;
        # Given standard datasources often hardcode /loki/api, let's just map to root of Loki and let client path handle it,
        # or map to root of datasource_logs.
        proxy_http_version 1.1;
        proxy_set_header X-Scope-OrgID $scope_orgid;
        proxy_pass http://datasource_logs;
    }

    # Traces (Tempo)
    # Maps /query/v1/traces/ -> /
    location /query/v1/traces/ {
        set $auth_context "external";
        set $license_capability "external_query";
        auth_request /auth/validate;
        auth_request_set $scope_orgid $upstream_http_x_scope_orgid;
        rewrite ^/query/v1/traces/(.*) /$1 break;
        proxy_http_version 1.1;
        proxy_set_header X-Scope-OrgID $scope_orgid;
        proxy_pass http://datasource_traces;
    }


    # --- 3. Platform Endpoints (/api/v1/platform, /console) ---

    # Auth Service API (Login, Config, Keys)
    # Maps /api/v1/platform/auth/login -> /auth/login
    location /api/v1/platform/ {
        # Some API endpoints are public (login), some protected by app logic
        rewrite ^/api/v1/platform/(.*) /$1 break;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-Context "platform";
        proxy_pass http://auth_service_http;
    }

    # OpAMP API (Lawrence)
    # Maps /api/v1/platform/opamp/ -> /api/v1/
    # Note: Lawrence backend already sends CORS headers, so we only handle OPTIONS preflight here.
    # Read-only calls (GET — status/list) stay ungated; anything that
    # mutates agent/group/config state ("agent_management") requires the
    # feature, since that's the actual remote-control capability (§16).
    location /api/v1/platform/opamp/ {
        # Handle preflight requests (these don't reach upstream)
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,iyzitrace-api-key';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        set $auth_context "external";
        set $license_capability "";
        if ($request_method != GET) {
            set $license_capability "agent_management";
        }
        auth_request /auth/validate;
        rewrite ^/api/v1/platform/opamp/(.*) /api/v1/$1 break;

        proxy_http_version 1.1;
        proxy_pass http://opamp_api_http;
    }

    # Auth Service UI (Dashboard)
    # Maps /console/ -> /
    location /console/ {
        rewrite ^/console/(.*) /$1 break;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_pass http://auth_service_http;
    }

    # Root Redirect -> Console
    location = / {
        return 301 /console/;
    }
  }

  # HTTPS ingress (443)
  server {
    listen 0.0.0.0:443 ssl;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    proxy_read_timeout 90s;
    proxy_send_timeout 90s;

    # --- Authentication Location ---
    location = /auth/validate {
        internal;
        proxy_pass http://auth_service_http/auth/validate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-Context $auth_context;
        proxy_set_header X-License-Capability $license_capability;
    }

    # --- 1. Ingestion Endpoints (/ingest) ---
    location /ingest/otlp/v1/logs {
        set $auth_context "agent";
        set $license_capability "ingest";
        auth_request /auth/validate;
        auth_request_set $scope_orgid $upstream_http_x_scope_orgid;
        rewrite ^/ingest/otlp/v1/logs(.*)$ /v1/logs$1 break;
        proxy_http_version 1.1; proxy_set_header X-Scope-OrgID $scope_orgid; proxy_pass http://log_otel_http;
    }
    location /ingest/otlp/v1/metrics {
        set $auth_context "agent";
        set $license_capability "ingest";
        auth_request /auth/validate;
        auth_request_set $scope_orgid $upstream_http_x_scope_orgid;
        rewrite ^/ingest/otlp/v1/metrics(.*)$ /v1/metrics$1 break;
        proxy_http_version 1.1; proxy_set_header X-Scope-OrgID $scope_orgid; proxy_pass http://metric_otel_http;
    }
    location /ingest/otlp/v1/traces {
        set $auth_context "agent";
        set $license_capability "ingest";
        auth_request /auth/validate;
        auth_request_set $scope_orgid $upstream_http_x_scope_orgid;
        rewrite ^/ingest/otlp/v1/traces(.*)$ /v1/traces$1 break;
        proxy_http_version 1.1; proxy_set_header X-Scope-OrgID $scope_orgid; proxy_pass http://trace_otel_http;
    }
    location /ingest/opamp/v1/ws {
        set $auth_context "agent";
        set $license_capability "";
        auth_request /auth/validate;
        rewrite ^/ingest/opamp/v1/ws(.*)$ /v1/opamp$1 break;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_pass http://opamp_otel_http;
    }
    location /ingest/opamp/v1/telemetry/ {
        set $auth_context "agent";
        set $license_capability "";
        auth_request /auth/validate;
        rewrite ^/ingest/opamp/v1/telemetry/(.*) /$1 break;
        proxy_http_version 1.1; proxy_pass http://opamp_telemetry_http;
    }

    # --- 2. Query Endpoints (/query) ---
    location /query/v1/metrics/ {
        set $auth_context "external";
        set $license_capability "external_query";
        auth_request /auth/validate;
        auth_request_set $scope_orgid $upstream_http_x_scope_orgid;
        rewrite ^/query/v1/metrics/(.*) /$1 break;
        proxy_http_version 1.1; proxy_set_header X-Scope-OrgID $scope_orgid; proxy_pass http://datasource_metrics;
    }
    location /query/v1/alerts/ {
        set $auth_context "external";
        set $license_capability "alerting";
        auth_request /auth/validate;
        rewrite ^/query/v1/alerts/(.*) /$1 break;
        proxy_http_version 1.1; proxy_pass http://datasource_alerts;
    }
    location /query/v1/logs/ {
        set $auth_context "external";
        set $license_capability "external_query";
        auth_request /auth/validate;
        auth_request_set $scope_orgid $upstream_http_x_scope_orgid;
        rewrite ^/query/v1/logs/(.*) /$1 break;
        proxy_http_version 1.1; proxy_set_header X-Scope-OrgID $scope_orgid; proxy_pass http://datasource_logs;
    }
    location /query/v1/traces/ {
        set $auth_context "external";
        set $license_capability "external_query";
        auth_request /auth/validate;
        auth_request_set $scope_orgid $upstream_http_x_scope_orgid;
        rewrite ^/query/v1/traces/(.*) /$1 break;
        proxy_http_version 1.1; proxy_set_header X-Scope-OrgID $scope_orgid; proxy_pass http://datasource_traces;
    }

    # --- Inventory Service API --- gated behind "inventory" (see :80 block comment).
    location /inventory/ {
      # CORS Headers for Grafana plugin
      add_header 'Access-Control-Allow-Origin' '*' always;
      add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
      add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,iyzitrace-api-key' always;
      add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

      # Handle preflight requests
      if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Type' 'text/plain; charset=utf-8';
        add_header 'Content-Length' 0;
        return 204;
      }

      set $auth_context "external";
      set $license_capability "inventory";
      auth_request /auth/validate;

      rewrite ^/inventory/(.*) /$1 break;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;

      proxy_read_timeout 90s;
      proxy_send_timeout 90s;

      proxy_pass http://inventory_service_http;
    }

    # --- 3. Platform Endpoints (/api/v1/platform, /console) ---
    location /api/v1/platform/ {
        rewrite ^/api/v1/platform/(.*) /$1 break;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-Context "platform";
        proxy_pass http://auth_service_http;
    }
    location /api/v1/platform/opamp/ {
        # Handle preflight requests (these don't reach upstream)
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,iyzitrace-api-key';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        set $auth_context "external";
        set $license_capability "";
        if ($request_method != GET) {
            set $license_capability "agent_management";
        }
        auth_request /auth/validate;
        rewrite ^/api/v1/platform/opamp/(.*) /api/v1/$1 break;
        proxy_http_version 1.1;
        proxy_pass http://opamp_api_http;
    }
    location /console/ {
        rewrite ^/console/(.*) /$1 break;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://auth_service_http;
    }
    location = / {
        return 301 /console/;
    }
  }
}
