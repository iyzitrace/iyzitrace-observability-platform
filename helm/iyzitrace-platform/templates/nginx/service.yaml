{{- if .Values.nginx.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "iyzitrace.nginxName" . }}
  labels:
    {{- include "iyzitrace.componentLabels" (dict "context" . "component" "nginx") | nindent 4 }}
  {{- if .Values.nginx.service.annotations }}
  annotations:
    {{- toYaml .Values.nginx.service.annotations | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.nginx.service.type }}
  {{- if and (or (eq .Values.nginx.service.type "LoadBalancer") (eq .Values.nginx.service.type "NodePort")) .Values.nginx.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ .Values.nginx.service.externalTrafficPolicy }}
  {{- end }}
  {{- if and (eq .Values.nginx.service.type "LoadBalancer") .Values.nginx.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.nginx.service.loadBalancerIP | quote }}
  {{- end }}
  {{- if and (eq .Values.nginx.service.type "LoadBalancer") .Values.nginx.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml .Values.nginx.service.loadBalancerSourceRanges | nindent 4 }}
  {{- end }}
  ports:
    - name: http
      port: {{ .Values.nginx.service.httpPort }}
      targetPort: http
      protocol: TCP
      {{- if and (eq .Values.nginx.service.type "NodePort") .Values.nginx.service.nodePorts.http }}
      nodePort: {{ .Values.nginx.service.nodePorts.http }}
      {{- end }}
    - name: https
      port: {{ .Values.nginx.service.httpsPort }}
      targetPort: https
      protocol: TCP
      {{- if and (eq .Values.nginx.service.type "NodePort") .Values.nginx.service.nodePorts.https }}
      nodePort: {{ .Values.nginx.service.nodePorts.https }}
      {{- end }}
  selector:
    {{- include "iyzitrace.componentSelectorLabels" (dict "context" . "component" "nginx") | nindent 4 }}
{{- end }}
