{{- if .Values.initCerts.enabled }}
{{- $secretName := include "iyzitrace.tlsSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $existingData := dict -}}
{{- if $existing -}}
{{- $existingData = ($existing.data | default dict) -}}
{{- end -}}

{{- $hasExistingBundle := and
    (hasKey $existingData "tls.crt")
    (hasKey $existingData "tls.key")
    (hasKey $existingData "ca.crt")
    (hasKey $existingData "ca.key") -}}

{{- $tlsCrt := "" -}}
{{- $tlsKey := "" -}}
{{- $caCrt := "" -}}
{{- $caKey := "" -}}

{{- if $hasExistingBundle -}}
{{- $tlsCrt = (get $existingData "tls.crt" | b64dec) -}}
{{- $tlsKey = (get $existingData "tls.key" | b64dec) -}}
{{- $caCrt = (get $existingData "ca.crt" | b64dec) -}}
{{- $caKey = (get $existingData "ca.key" | b64dec) -}}
{{- else -}}
{{- $serviceName := include "iyzitrace.nginxName" . -}}
{{- $clusterDomain := .Values.global.clusterDomain | default "cluster.local" -}}
{{- $ca := genCA "IyziTrace-Bootstrap-CA" 3650 -}}
{{- $cert := genSignedCert
      $serviceName
      (list "127.0.0.1")
      (list
        $serviceName
        (printf "%s.%s.svc" $serviceName .Release.Namespace)
        (printf "%s.%s.svc.%s" $serviceName .Release.Namespace $clusterDomain)
        "localhost")
      365
      $ca -}}
{{- $tlsCrt = $cert.Cert -}}
{{- $tlsKey = $cert.Key -}}
{{- $caCrt = $ca.Cert -}}
{{- $caKey = $ca.Key -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "iyzitrace.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: kubernetes.io/tls
stringData:
  tls.crt: |
{{ $tlsCrt | indent 4 }}
  tls.key: |
{{ $tlsKey | indent 4 }}
  ca.crt: |
{{ $caCrt | indent 4 }}
  ca.key: |
{{ $caKey | indent 4 }}
{{- end }}
