{{- $secretName := include "iyzitrace.s3SecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $existingData := dict -}}
{{- if $existing -}}
{{- $existingData = ($existing.data | default dict) -}}
{{- end -}}

{{- $lokiAccessKey := randAlphaNum 32 -}}
{{- if hasKey $existingData "LOKI_ACCESS_KEY" -}}
{{- $lokiAccessKey = (get $existingData "LOKI_ACCESS_KEY" | b64dec) -}}
{{- end -}}

{{- $lokiSecretKey := randAlphaNum 32 -}}
{{- if hasKey $existingData "LOKI_SECRET_KEY" -}}
{{- $lokiSecretKey = (get $existingData "LOKI_SECRET_KEY" | b64dec) -}}
{{- end -}}

{{- $tempoAccessKey := randAlphaNum 32 -}}
{{- if hasKey $existingData "TEMPO_ACCESS_KEY" -}}
{{- $tempoAccessKey = (get $existingData "TEMPO_ACCESS_KEY" | b64dec) -}}
{{- end -}}

{{- $tempoSecretKey := randAlphaNum 32 -}}
{{- if hasKey $existingData "TEMPO_SECRET_KEY" -}}
{{- $tempoSecretKey = (get $existingData "TEMPO_SECRET_KEY" | b64dec) -}}
{{- end -}}

{{- $thanosAccessKey := randAlphaNum 32 -}}
{{- if hasKey $existingData "THANOS_ACCESS_KEY" -}}
{{- $thanosAccessKey = (get $existingData "THANOS_ACCESS_KEY" | b64dec) -}}
{{- end -}}

{{- $thanosSecretKey := randAlphaNum 32 -}}
{{- if hasKey $existingData "THANOS_SECRET_KEY" -}}
{{- $thanosSecretKey = (get $existingData "THANOS_SECRET_KEY" | b64dec) -}}
{{- end -}}

{{- $jwtSecret := randAlphaNum 32 -}}
{{- if hasKey $existingData "JWT_SECRET" -}}
{{- $jwtSecret = (get $existingData "JWT_SECRET" | b64dec) -}}
{{- end -}}

{{- $seaweedConfig := dict
  "identities" (list
    (dict
      "name" "loki"
      "credentials" (list (dict "accessKey" $lokiAccessKey "secretKey" $lokiSecretKey))
      "actions" (list "Read" "Write" "List" "Tagging" "Admin"))
    (dict
      "name" "tempo"
      "credentials" (list (dict "accessKey" $tempoAccessKey "secretKey" $tempoSecretKey))
      "actions" (list "Read" "Write" "List" "Tagging" "Admin"))
    (dict
      "name" "thanos"
      "credentials" (list (dict "accessKey" $thanosAccessKey "secretKey" $thanosSecretKey))
      "actions" (list "Read" "Write" "List" "Tagging" "Admin"))) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "iyzitrace.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  LOKI_ACCESS_KEY: {{ $lokiAccessKey | quote }}
  LOKI_SECRET_KEY: {{ $lokiSecretKey | quote }}
  TEMPO_ACCESS_KEY: {{ $tempoAccessKey | quote }}
  TEMPO_SECRET_KEY: {{ $tempoSecretKey | quote }}
  THANOS_ACCESS_KEY: {{ $thanosAccessKey | quote }}
  THANOS_SECRET_KEY: {{ $thanosSecretKey | quote }}
  JWT_SECRET: {{ $jwtSecret | quote }}
  objstore.yml: |
    type: s3
    config:
      bucket: thanos-time-series
      endpoint: {{ include "iyzitrace.seaweedfsEndpoint" . | quote }}
      access_key: {{ $thanosAccessKey | quote }}
      secret_key: {{ $thanosSecretKey | quote }}
      insecure: true
  seaweedfs_s3_config: |
{{ $seaweedConfig | toPrettyJson | indent 4 }}
