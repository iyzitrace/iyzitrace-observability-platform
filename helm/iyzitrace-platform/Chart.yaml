apiVersion: v2
name: iyzitrace-platform
description: IyziTrace Observability Platform — umbrella Helm chart
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  # --- Distributed tracing backend ---
  - name: tempo-distributed
    version: "1.61.3"
    repository: https://grafana.github.io/helm-charts
    alias: tempo
    condition: tempo.enabled

  # --- Log aggregation ---
  - name: loki
    version: "6.53.0"
    repository: https://grafana.github.io/helm-charts
    condition: loki.enabled

  # --- Metrics TSDB ---
  - name: prometheus
    version: "28.9.1"
    repository: https://prometheus-community.github.io/helm-charts
    condition: prometheus.enabled

  # --- Long-term metrics storage ---
  - name: thanos
    version: "17.3.1"
    repository: https://charts.bitnami.com/bitnami
    condition: thanos.enabled

  # --- S3-compatible object store ---
  - name: seaweedfs
    version: "4.16.0"
    repository: https://seaweedfs.github.io/seaweedfs/helm
    condition: seaweedfs.enabled

  # --- OTel Operator (manages collector CRDs) ---
  - name: opentelemetry-operator
    version: "0.105.1"
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
    alias: otelOperator
    condition: otelOperator.enabled
